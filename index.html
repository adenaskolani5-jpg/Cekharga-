<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="description" content="Daftar harga paket internet dan top-up game. Ringan, cepat, ramah perangkat kelas bawah.">
<title>PasirPogorCell — Harga Internet & Top-Up Game</title>
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-2: #eef0f3;
  --text: #14171c;
  --muted: #5c6773;
  --border: #e4e8ec;
  --primary: #2563eb;
  --primary-ink: #ffffff;
  --primary-soft: #e8effd;
  --radius: 12px;
  --radius-sm: 8px;
  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px;
  --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 1px 3px rgba(15,23,42,.06);
  /* Token badge */
  --badge-populer-bg: #fef3c7;  --badge-populer-fg: #92400e;
  --badge-promo-bg:   #fee2e2;  --badge-promo-fg:   #991b1b;
  --badge-gangguan-bg:#fef9c3;  --badge-gangguan-fg:#854d0e;
  color-scheme: light;
}

/* Tema gelap — berlaku baik saat dipilih manual (data-theme="dark")
   maupun saat sistem memilih gelap dan pengguna belum menentukan pilihan. */
/* Tema gelap — dipilih manual via data-theme="dark" */
:root[data-theme="dark"] {
  --bg: #0f1115;
  --surface: #171a20;
  --surface-2: #1f232b;
  --text: #e7eaee;
  --muted: #9aa3ad;
  --border: #262b33;
  --primary: #5b9aff;
  --primary-ink: #0b1220;
  --primary-soft: #1c2a44;
  --shadow: none;
  --badge-populer-bg: #422006;  --badge-populer-fg: #fbbf24;
  --badge-promo-bg:   #450a0a;  --badge-promo-fg:   #fca5a5;
  --badge-gangguan-bg:#422006;  --badge-gangguan-fg:#fde68a;
  color-scheme: dark;
}

/* Tema gelap — dari preferensi sistem, hanya jika pengguna belum memilih manual */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115;
    --surface: #171a20;
    --surface-2: #1f232b;
    --text: #e7eaee;
    --muted: #9aa3ad;
    --border: #262b33;
    --primary: #5b9aff;
    --primary-ink: #0b1220;
    --primary-soft: #1c2a44;
    --shadow: none;
    --badge-populer-bg: #422006;  --badge-populer-fg: #fbbf24;
    --badge-promo-bg:   #450a0a;  --badge-promo-fg:   #fca5a5;
    --badge-gangguan-bg:#422006;  --badge-gangguan-fg:#fde68a;
    color-scheme: dark;
  }
}

/* ============================================================
   Reset & base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, dl, dd, dt, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button, input { font: inherit; color: inherit; }
img { display: block; }
.wrap { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 var(--sp-4); }

/* ============================================================
   Header + Tabs
   ============================================================ */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: var(--sp-4) 0 var(--sp-3);
}
.site-header .wrap {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--sp-3); flex-wrap: wrap;
}
.brand { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.meta  { font-size: 13px; color: var(--muted); }

.tabs {
  position: sticky; top: 0; z-index: 10;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.tabs-inner { display: flex; gap: var(--sp-1); }
.tab {
  appearance: none; background: transparent; border: 0;
  padding: var(--sp-3) var(--sp-4);
  font-size: 15px; font-weight: 500;
  color: var(--muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color .15s ease, border-color .15s ease;
}
.tab:hover { color: var(--text); }
.tab.is-active {
  color: var(--primary);
  border-bottom-color: var(--primary);
  font-weight: 600;
}
.tab:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: -2px;
  border-radius: var(--radius-sm);
}

/* ============================================================
   Picker rows (logo chips + category chips)
   ============================================================ */
.pickers { padding-top: var(--sp-3); }
.picker-row {
  display: flex; gap: var(--sp-2);
  overflow-x: auto;
  padding: var(--sp-1) 0 var(--sp-2);
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.picker-row::-webkit-scrollbar { display: none; }
.picker-row:empty { display: none; }

.chip-logo {
  flex: 0 0 auto;
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: 4px 12px 4px 4px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 13px; font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: border-color .15s ease, background .15s ease, color .15s ease;
}
.chip-logo:hover { border-color: var(--muted); }
.chip-logo.is-active {
  border-color: var(--primary);
  background: var(--primary-soft);
  color: var(--primary);
  font-weight: 600;
}
.chip-logo:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.chip-logo img {
  width: 26px; height: 26px;
  border-radius: 50%;
  object-fit: cover;
  background: var(--surface-2);
  flex-shrink: 0;
}
.chip-cat {
  flex: 0 0 auto;
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  padding: 5px 14px;
  border-radius: 999px;
  font-size: 12.5px; font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.chip-cat:hover { border-color: var(--muted); }
.chip-cat.is-active {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--primary-ink);
  font-weight: 600;
}
.chip-cat:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ============================================================
   Section head (logo besar + nama + count)
   ============================================================ */
.section-head {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) 0 var(--sp-2);
}
.section-logo {
  width: 48px; height: 48px;
  border-radius: 10px;
  object-fit: cover;
  background: var(--surface-2);
  flex-shrink: 0;
}
.section-title { font-size: 16px; font-weight: 700; margin: 0; line-height: 1.25; }
.section-sub   { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ============================================================
   Search
   ============================================================ */
.search { position: relative; margin-bottom: var(--sp-3); }
.search-icon {
  position: absolute; left: 12px; top: 50%;
  width: 18px; height: 18px;
  transform: translateY(-50%);
  fill: var(--muted); pointer-events: none;
}
.search input {
  width: 100%; padding: 11px 12px 11px 38px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface); color: var(--text);
  transition: border-color .15s ease, box-shadow .15s ease;
}
.search input::placeholder { color: var(--muted); }
.search input:focus {
  outline: none; border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-soft);
}
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }

/* ============================================================
   Package list (internet)
   ============================================================ */
.pkg-list { padding-bottom: var(--sp-6); }

.pkg {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: var(--sp-2);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: border-color .15s ease;
}
.pkg:hover { border-color: var(--muted); }
.pkg[open] { border-color: var(--primary); }

.pkg > summary {
  list-style: none;
  cursor: pointer;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: var(--sp-3);
  padding: 11px 14px;
  user-select: none;
}
.pkg > summary::-webkit-details-marker { display: none; }
.pkg > summary:focus-visible {
  outline: 2px solid var(--primary); outline-offset: -2px;
}
.pkg-name {
  font-size: 14px; font-weight: 600; line-height: 1.3;
  word-break: break-word;
}
.pkg-sub {
  font-size: 12px; color: var(--muted); margin-top: 2px;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.pkg-price-wrap { text-align: right; white-space: nowrap; }
.pkg-price {
  font-size: 14px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.pkg-price-old {
  font-size: 11px; color: var(--muted);
  text-decoration: line-through;
  font-weight: 500;
  display: block;
  line-height: 1;
  margin-bottom: 2px;
}
.chev {
  width: 16px; height: 16px; fill: var(--muted);
  transition: transform .2s ease; flex-shrink: 0;
}
details[open] > summary .chev { transform: rotate(180deg); }

.pkg-detail {
  padding: 0 14px 14px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  line-height: 1.55;
  color: var(--text);
}
.pkg-detail .kv {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 6px 12px;
  padding-top: 12px;
  font-size: 13px;
}
.pkg-detail .kv dt { color: var(--muted); }
.pkg-detail .kv dd { font-variant-numeric: tabular-nums; }
.pkg-detail .note {
  margin-top: 12px;
  padding: 10px 12px;
  background: var(--surface-2);
  border-radius: 8px;
  font-size: 12.5px;
  color: var(--text);
  white-space: pre-line;
}

/* ============================================================
   Game list
   ============================================================ */
.game-item {
  display: flex; justify-content: space-between; align-items: center;
  gap: var(--sp-3);
  padding: 11px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: var(--sp-2);
  font-size: 14px;
  box-shadow: var(--shadow);
}
.game-item-name { word-break: break-word; }
.game-item-price {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* ============================================================
   Badges
   ============================================================ */
.badge {
  display: inline-block;
  font-size: 10px; font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .04em;
  padding: 2px 7px;
  border-radius: 999px;
  line-height: 1.5;
}
.badge-populer  { background: #fef3c7; color: #92400e; }
.badge-promo    { background: #fee2e2; color: #991b1b; }
.badge-gangguan { background: #fef9c3; color: #854d0e; }
.badge-populer  { background: var(--badge-populer-bg);  color: var(--badge-populer-fg); }
.badge-promo    { background: var(--badge-promo-bg);    color: var(--badge-promo-fg); }
.badge-gangguan { background: var(--badge-gangguan-bg); color: var(--badge-gangguan-fg); }

/* ============================================================
   States
   ============================================================ */
.state {
  padding: var(--sp-6) var(--sp-4);
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius);
}
.state strong {
  display: block; color: var(--text);
  font-size: 15px; margin-bottom: var(--sp-1);
}

/* ============================================================
   Footer
   ============================================================ */
.site-footer {
  padding: var(--sp-5) 0 calc(var(--sp-5) + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  background: var(--surface);
}
.site-footer p {
  font-size: 12px; color: var(--muted);
  text-align: center; line-height: 1.5;
}
/* ============================================================
   Header right cluster + Theme toggle
   ============================================================ */
.header-right {
  display: flex;
  align-items: center;
  gap: var(--sp-3);
}

.theme-toggle {
  appearance: none;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  width: 36px; height: 36px;
  padding: 0;
  border-radius: 50%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
  transition: border-color .15s ease, background .15s ease, color .15s ease;
}
.theme-toggle:hover { border-color: var(--muted); }
.theme-toggle:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.theme-toggle svg { width: 18px; height: 18px; fill: currentColor; display: block; }

/* Default (light): tampilkan bulan (aksi = aktifkan gelap) */
.theme-toggle .icon-sun  { display: none; }
.theme-toggle .icon-moon { display: block; }

/* Dark manual: tampilkan matahari */
:root[data-theme="dark"] .theme-toggle .icon-sun  { display: block; }
:root[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

/* Dark dari sistem (dan belum ada pilihan manual): tampilkan matahari */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .theme-toggle .icon-sun  { display: block; }
  :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: none; }
}
/* ============================================================
   Motion & a11y
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
[hidden] { display: none !important; }
/* ============================================================
   Floating WhatsApp button
   ============================================================ */
.wa-float {
  position: fixed;
  right: 16px;
  bottom: calc(16px + env(safe-area-inset-bottom));
  z-index: 50;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  background: #25d366;
  color: #ffffff;
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  border-radius: 999px;
  box-shadow: 0 6px 16px rgba(0, 0, 0, .18);
  transition: transform .15s ease, box-shadow .15s ease;
}
.wa-float:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 0, .22); }
.wa-float:focus-visible { outline: 3px solid #128c7e; outline-offset: 3px; }
.wa-float svg { width: 22px; height: 22px; fill: currentColor; flex-shrink: 0; }

@media (max-width: 480px) {
  .wa-float {
    right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom));
    padding: 12px;
  }
  .wa-float span { display: none; } /* jadi icon-only di layar kecil */
}

/* ============================================================
   Order button di detail paket & item game
   ============================================================ */
.btn-order {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 16px;
  background: #25d366;
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 600;
  text-decoration: none;
  border-radius: 8px;
  transition: background .15s ease;
}
.btn-order:hover { background: #1ebe5b; }
.btn-order:focus-visible { outline: 2px solid #128c7e; outline-offset: 2px; }
.btn-order svg { width: 16px; height: 16px; fill: currentColor; }

.game-item-wa {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px; height: 32px;
  background: #25d366;
  color: #ffffff;
  border-radius: 50%;
  text-decoration: none;
  flex-shrink: 0;
  transition: background .15s ease;
}
.game-item-wa:hover { background: #1ebe5b; }
.game-item-wa:focus-visible { outline: 2px solid #128c7e; outline-offset: 2px; }
.game-item-wa svg { width: 16px; height: 16px; fill: currentColor; }

.game-item { gap: 10px; }
.game-item-price { flex-shrink: 0; }

/* Footer kontak */
.footer-contact {
  display: flex; align-items: center; justify-content: center;
  gap: 10px;
  margin-bottom: 12px;
  font-size: 14px;
}
.footer-contact a {
  color: var(--primary);
  font-weight: 600;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.footer-contact a:hover { text-decoration: underline; }
.footer-contact svg { width: 16px; height: 16px; fill: currentColor; }
</style>
<script>
(function () {
  try {
    var t = localStorage.getItem('theme');
    if (t === 'dark' || t === 'light') {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {}
})();
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <h1 class="brand">PasirPogorCell</h1>
    <div class="header-right">
      <p class="meta">Harga referensi · <time id="last-updated">—</time></p>
      <button class="theme-toggle" id="theme-toggle" type="button"
              aria-label="Aktifkan tema gelap" aria-pressed="false">
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0-12a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V4a1 1 0 0 1 1-1zm0 15a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zM4 12a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2H5a1 1 0 0 1-1-1zm15 0a1 1 0 0 1 1-1h2a1 1 0 1 1 0 2h-2a1 1 0 0 1-1-1zM5.64 5.64a1 1 0 0 1 1.41 0l1.42 1.42a1 1 0 0 1-1.42 1.41L5.64 7.05a1 1 0 0 1 0-1.41zm11.31 11.31a1 1 0 0 1 1.42 0l1.41 1.42a1 1 0 0 1-1.41 1.41l-1.42-1.41a1 1 0 0 1 0-1.42zM18.36 5.64a1 1 0 0 1 0 1.41l-1.42 1.42a1 1 0 0 1-1.41-1.42l1.41-1.41a1 1 0 0 1 1.42 0zM7.05 18.36a1 1 0 0 1 0 1.41l-1.42 1.42a1 1 0 0 1-1.41-1.42l1.41-1.41a1 1 0 0 1 1.42 0z"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M21.5 14.3a1 1 0 0 0-1.1-.3 7.5 7.5 0 0 1-9.4-9.4 1 1 0 0 0-1.3-1.2A10 10 0 1 0 21.5 15.4a1 1 0 0 0 0-1.1zM12 20a8 8 0 0 1-6.9-11.9A9.5 9.5 0 0 0 15.9 18a8 8 0 0 1-3.9 2z"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Kategori harga">
  <div class="wrap tabs-inner">
    <button class="tab is-active" role="tab" id="tab-internet"
            aria-selected="true" aria-controls="panel-internet" tabindex="0"
            data-tab="internet">Internet</button>
    <button class="tab" role="tab" id="tab-game"
            aria-selected="false" aria-controls="panel-game" tabindex="-1"
            data-tab="game">Top-Up Game</button>
  </div>
</nav>

<main class="wrap">

  <section id="panel-internet" role="tabpanel" aria-labelledby="tab-internet" tabindex="0">
    <div class="pickers">
      <div class="picker-row" id="chips-internet-op" role="group" aria-label="Pilih operator"></div>
      <div class="picker-row" id="chips-internet-cat" role="group" aria-label="Pilih kategori paket"></div>
    </div>
    <div class="section-head" id="head-internet"></div>
    <div class="search">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path d="M8.5 3a5.5 5.5 0 1 0 3.42 9.81l3.14 3.13a1 1 0 0 0 1.42-1.42l-3.14-3.13A5.5 5.5 0 0 0 8.5 3Zm-3.5 5.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0Z"/>
      </svg>
      <input type="search" id="search-internet" placeholder="Cari paket…"
             autocomplete="off" enterkeyhint="search" aria-label="Cari paket internet">
    </div>
    <div class="pkg-list" id="list-internet" aria-live="polite"></div>
  </section>

  <section id="panel-game" role="tabpanel" aria-labelledby="tab-game" tabindex="0" hidden>
    <div class="pickers">
      <div class="picker-row" id="chips-game-game" role="group" aria-label="Pilih game"></div>
      <div class="picker-row" id="chips-game-cat" role="group" aria-label="Pilih kategori top-up"></div>
    </div>
    <div class="section-head" id="head-game"></div>
    <div class="search">
      <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
        <path d="M8.5 3a5.5 5.5 0 1 0 3.42 9.81l3.14 3.13a1 1 0 0 0 1.42-1.42l-3.14-3.13A5.5 5.5 0 0 0 8.5 3Zm-3.5 5.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0Z"/>
      </svg>
      <input type="search" id="search-game" placeholder="Cari nominal…"

  'Mobile Legends': 'https://i.ibb.co.com/fYs8TRBd/IMG-20260620-080306.jpg',
  'Free Fire': 'https://i.ibb.co.com/Fbzy6Y7v/IMG-20260620-080935.jpg',
  'PUBG Mobile': 'https://i.ibb.co.com/xKJJBFN8/IMG-20260620-081207.jpg',
  'Call Of Duty Mobile': 'https://i.ibb.co.com/8LhLZSjS/IMG-20260620-082153.jpg',
  'Honor Of Kings': 'https://i.ibb.co.com/zVnj3Prr/IMG-20260620-082452.jpg',
  'Genshin Impact': 'https://i.ibb.co.com/93HRTpt8/IMG-20260620-083215.jpg',
  'Roblox': 'https://i.ibb.co.com/gGpSvjy/IMG-20260620-083534.jpg',

};

<!-- ============================================================
     LOGIKA APLIKASI
     ============================================================ -->

<script>
(function () {
  'use strict';

  /* ---------- State ---------- */
  var state = {
    tab: 'internet',
    internet: { op: null, cat: null, q: '' },
    game:     { game: null, cat: null, q: '' }
  };
  /* ---------- Kontak penjual ---------- */
var WA_NUMBER = '6283844843020';

function waLink(message) {
  var base = 'https://wa.me/' + WA_NUMBER;
  return message ? base + '?text=' + encodeURIComponent(message) : base;
}

function waIcon(size) {
  var s = size || 16;
  return '<svg viewBox="0 0 24 24" width="' + s + '" height="' + s + '" aria-hidden="true">' +
    '<path d="M19.05 4.91A9.82 9.82 0 0 0 12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.91-7.01zM12.04 20.15h-.01c-1.5 0-2.97-.4-4.25-1.17l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.36c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.7 8.23-8.23 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29z"/>' +
  '</svg>';
}

  /* ---------- Helpers ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function firstKey(o) { var k = Object.keys(o || {}); return k[0] || null; }
  function isArray(v) { return Object.prototype.toString.call(v) === '[object Array]'; }

  var rupiah = new Intl.NumberFormat('id-ID', {
    style: 'currency', currency: 'IDR', maximumFractionDigits: 0
  });
  function fmt(n) {
    return (typeof n === 'number' && isFinite(n)) ? rupiah.format(n) : '—';
  }
  function formatDate(iso) {
    if (!iso) return '—';
    var d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return iso;
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function imgTag(src, cls, alt) {
    if (!src) return '';
    return '<img class="' + cls + '" src="' + esc(src) + '" alt="' + esc(alt || '') +
           '" loading="lazy" decoding="async" onerror="this.style.display=\'none\'">';
  }

  /* ============================================================
     INTERNET
     ============================================================ */
  function renderInternetOpChips() {
    var wrap = $('#chips-internet-op');
    var ops = window.OPERATORS || {};
    var names = Object.keys(ops);
    if (!names.length) { wrap.innerHTML = ''; return; }

    wrap.innerHTML = names.map(function (name) {
      var active = state.internet.op === name ? ' is-active' : '';
      return '<button type="button" class="chip-logo' + active + '" data-op="' + esc(name) + '">' +
        imgTag(window.IMAGES && window.IMAGES[name], '', name) +
        '<span>' + esc(name) + '</span></button>';
    }).join('');
  }

  function renderInternetCatChips() {
    var wrap = $('#chips-internet-cat');
    var op = (window.OPERATORS || {})[state.internet.op];
    if (!op) { wrap.innerHTML = ''; return; }

    var cats = Object.keys(op);
    if (cats.length <= 1) {
      wrap.innerHTML = '';
      wrap.hidden = true;
      state.internet.cat = cats[0] || null;
      return;
    }
    wrap.hidden = false;

    wrap.innerHTML = cats.map(function (c) {
      var active = state.internet.cat === c ? ' is-active' : '';
      return '<button type="button" class="chip-cat' + active + '" data-cat="' + esc(c) + '">' +
             esc(c) + '</button>';
    }).join('');
  }

  function renderInternetHead() {
    var wrap = $('#head-internet');
    var op = state.internet.op;
    if (!op) { wrap.innerHTML = ''; return; }

    // Hitung jumlah paket di kategori terpilih
    var pkgs = getInternetPackages();
    var count = pkgs.length;

    wrap.innerHTML =
      imgTag(window.IMAGES && window.IMAGES[op], 'section-logo', op) +
      '<div>' +
        '<h2 class="section-title">' + esc(op) + '</h2>' +
        '<p class="section-sub">' + count + ' paket' +
          (state.internet.cat ? ' · ' + esc(state.internet.cat) : '') + '</p>' +
      '</div>';
  }

  function getInternetPackages() {
    var op = (window.OPERATORS || {})[state.internet.op];
    if (!op) return [];
    if (state.internet.cat && op[state.internet.cat]) {
      return op[state.internet.cat] || [];
    }
    // Gabung semua kategori
    return Object.keys(op).reduce(function (acc, k) {
      return acc.concat(op[k] || []);
    }, []);
  }

  function internetPkgHtml(p, opName) {
    var badges = '';
    if (p.populer)  badges += '<span class="badge badge-populer">Populer</span>';
    if (p.promo)    badges += '<span class="badge badge-promo">Promo</span>';
    if (p.gangguan) badges += '<span class="badge badge-gangguan">Gangguan</span>';

    var subParts = [];
    if (typeof p.kuota === 'number') subParts.push(p.kuota + ' GB');
    else if (p.kuota) subParts.push(p.kuota);
    if (badges) subParts.push(badges);

    var priceBlock = '';
    if (p.hargaCoret) {
      priceBlock += '<span class="pkg-price-old">' + esc(fmt(p.hargaCoret)) + '</span>';
    }
    priceBlock += '<span class="pkg-price">' + esc(fmt(p.harga)) + '</span>';

    var detailRows = '';
    if (p.kuota) {
      var kuotaText = (typeof p.kuota === 'number') ? p.kuota + ' GB' : p.kuota;
      detailRows += '<dt>Kuota</dt><dd>' + esc(kuotaText) + '</dd>';
    }
    if (opName) detailRows += '<dt>Operator</dt><dd>' + esc(opName) + '</dd>';
    if (state.internet.cat) detailRows += '<dt>Kategori</dt><dd>' + esc(state.internet.cat) + '</dd>';

var orderMsg = 'Halo, saya mau pesan:\n' +
  'Paket: ' + (p.nama || '') + '\n' +
  'Operator: ' + (opName || '') + '\n' +
  (state.internet.cat ? 'Kategori: ' + state.internet.cat + '\n' : '') +
  'Harga: ' + fmt(p.harga);

var detail = '<div class="pkg-detail">';
if (detailRows) detail += '<dl class="kv">' + detailRows + '</dl>';
if (p.ket) detail += '<p class="note">' + esc(p.ket) + '</p>';
if (p.noteGangguan) detail += '<p class="note">Catatan gangguan: ' + esc(p.noteGangguan) + '</p>';
detail += '<a class="btn-order" href="' + esc(waLink(orderMsg)) +
          '" target="_blank" rel="noopener">' +
          waIcon(16) + '<span>Pesan via WhatsApp</span></a>';
detail += '</div>';

    return '<details class="pkg">' +
      '<summary>' +
        '<div>' +
          '<div class="pkg-name">' + esc(p.nama || 'Paket') + '</div>' +
          (subParts.length ? '<div class="pkg-sub">' + subParts.join(' ') + '</div>' : '') +
        '</div>' +
        '<div class="pkg-price-wrap">' + priceBlock + '</div>' +
        '<svg class="chev" viewBox="0 0 20 20" aria-hidden="true" focusable="false">' +
          '<path d="M5.3 7.3a1 1 0 0 1 1.4 0L10 10.6l3.3-3.3a1 1 0 1 1 1.4 1.4l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 0 1 0-1.4Z"/>' +
        '</svg>' +
      '</summary>' +
      detail +
    '</details>';
  }

  function renderInternetList() {
    var wrap = $('#list-internet');
    var pkgs = getInternetPackages();
    var q = state.internet.q.trim().toLowerCase();

    if (q) {
      pkgs = pkgs.filter(function (p) {
        var hay = ((p.nama || '') + ' ' + (p.ket || '')).toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }

    if (!pkgs.length) {
      wrap.innerHTML = '<div class="state"><strong>Tidak ada hasil</strong>' +
        'Coba ubah kata kunci atau pilih kategori lain.</div>';
      return;
    }

    wrap.innerHTML = pkgs.map(function (p) {
      return internetPkgHtml(p, state.internet.op);
    }).join('');
  }

  function renderInternet() {
    renderInternetOpChips();
    renderInternetCatChips();
    renderInternetHead();
    renderInternetList();
  }

  /* ============================================================
     GAME
     ============================================================ */
  function renderGameChips() {
    var wrap = $('#chips-game-game');
    var games = window.GAMES || {};
    var names = Object.keys(games);
    if (!names.length) { wrap.innerHTML = ''; return; }

    wrap.innerHTML = names.map(function (name) {
      var active = state.game.game === name ? ' is-active' : '';
      return '<button type="button" class="chip-logo' + active + '" data-game="' + esc(name) + '">' +
        imgTag(window.IMAGES && window.IMAGES[name], '', name) +
        '<span>' + esc(name) + '</span></button>';
    }).join('');
  }

  function renderGameCatChips() {
    var wrap = $('#chips-game-cat');
    var data = (window.GAMES || {})[state.game.game];
    if (!data || isArray(data)) {
      wrap.innerHTML = '';
      wrap.hidden = true;
      state.game.cat = null;
      return;
    }
    var cats = Object.keys(data);
    if (cats.length <= 1) {
      wrap.innerHTML = '';
      wrap.hidden = true;
      state.game.cat = cats[0] || null;
      return;
    }
    wrap.hidden = false;
    wrap.innerHTML = cats.map(function (c) {
      var active = state.game.cat === c ? ' is-active' : '';
      return '<button type="button" class="chip-cat' + active + '" data-cat="' + esc(c) + '">' +
             esc(c) + '</button>';
    }).join('');
  }

  function getGameItems() {
    var data = (window.GAMES || {})[state.game.game];
    if (!data) return [];
    if (isArray(data)) return data;
    if (state.game.cat && data[state.game.cat]) return data[state.game.cat] || [];
    // Gabung semua kategori
    return Object.keys(data).reduce(function (acc, k) {
      return acc.concat(data[k] || []);
    }, []);
  }

  function renderGameHead() {
    var wrap = $('#head-game');
    var name = state.game.game;
    if (!name) { wrap.innerHTML = ''; return; }

    var items = getGameItems();
    var count = items.length;

    wrap.innerHTML =
      imgTag(window.IMAGES && window.IMAGES[name], 'section-logo', name) +
      '<div>' +
        '<h2 class="section-title">' + esc(name) + '</h2>' +
        '<p class="section-sub">' + count + ' nominal' +
          (state.game.cat ? ' · ' + esc(state.game.cat) : '') + '</p>' +
      '</div>';
  }

function gameItemHtml(item) {
  var msg = 'Halo, saya mau top-up:\n' +
    'Game: ' + (state.game.game || '') + '\n' +
    (state.game.cat ? 'Kategori: ' + state.game.cat + '\n' : '') +
    'Item: ' + (item.nama || '') + '\n' +
    'Harga: ' + fmt(item.harga);

  return '<div class="game-item">' +
    '<span class="game-item-name">' + esc(item.nama || '—') + '</span>' +
    '<span class="game-item-price">' + esc(fmt(item.harga)) + '</span>' +
    '<a class="game-item-wa" href="' + esc(waLink(msg)) +
      '" target="_blank" rel="noopener" aria-label="Pesan ' + esc(item.nama || '') + '">' +
      waIcon(16) +
    '</a>' +
  '</div>';
}

  function renderGameList() {
    var wrap = $('#list-game');
    var items = getGameItems();
    var q = state.game.q.trim().toLowerCase();

    if (q) {
      items = items.filter(function (it) {
        return (it.nama || '').toLowerCase().indexOf(q) !== -1;
      });
    }

    if (!items.length) {
      wrap.innerHTML = '<div class="state"><strong>Tidak ada hasil</strong>' +
        'Coba ubah kata kunci atau pilih kategori lain.</div>';
      return;
    }

    wrap.innerHTML = items.map(gameItemHtml).join('');
  }

  function renderGames() {
    renderGameChips();
    renderGameCatChips();
    renderGameHead();
    renderGameList();
  }

  /* ============================================================
     TABS
     ============================================================ */
  function activateTab(name, focus) {
    if (name !== 'internet' && name !== 'game') return;
    state.tab = name;
    $$('.tab').forEach(function (btn) {
      var on = btn.dataset.tab === name;
      btn.classList.toggle('is-active', on);
      btn.setAttribute('aria-selected', on ? 'true' : 'false');
      btn.tabIndex = on ? 0 : -1;
      if (on && focus) btn.focus();
    });
    $('#panel-internet').hidden = name !== 'internet';
    $('#panel-game').hidden = name !== 'game';
  }

  /* ============================================================
     EVENTS
     ============================================================ */
  function bindTabs() {
    $$('.tab').forEach(function (btn, i, arr) {
      btn.addEventListener('click', function () { activateTab(btn.dataset.tab, false); });
      btn.addEventListener('keydown', function (e) {
        var k = e.key;
        if (k !== 'ArrowRight' && k !== 'ArrowLeft' && k !== 'Home' && k !== 'End') return;
        e.preventDefault();
        var n = i;
        if (k === 'ArrowRight') n = (i + 1) % arr.length;
        if (k === 'ArrowLeft')  n = (i - 1 + arr.length) % arr.length;
        if (k === 'Home')       n = 0;
        if (k === 'End')        n = arr.length - 1;
        activateTab(arr[n].dataset.tab, true);
      });
    });
  }

  function bindInternetEvents() {
    $('#chips-internet-op').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-op]');
      if (!btn) return;
      state.internet.op = btn.dataset.op;
      var op = (window.OPERATORS || {})[state.internet.op];
      state.internet.cat = firstKey(op);
      state.internet.q = '';
      $('#search-internet').value = '';
      renderInternet();
    });

    $('#chips-internet-cat').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-cat]');
      if (!btn) return;
      state.internet.cat = btn.dataset.cat;
      renderInternetCatChips();
      renderInternetHead();
      renderInternetList();
    });

    var t;
    $('#search-internet').addEventListener('input', function (e) {
      clearTimeout(t);
      t = setTimeout(function () {
        state.internet.q = e.target.value;
        renderInternetList();
      }, 120);
    });
  }

  function bindGameEvents() {
    $('#chips-game-game').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-game]');
      if (!btn) return;
      state.game.game = btn.dataset.game;
      var data = (window.GAMES || {})[state.game.game];
      state.game.cat = isArray(data) ? null : firstKey(data);
      state.game.q = '';
      $('#search-game').value = '';
      renderGames();
    });

    $('#chips-game-cat').addEventListener('click', function (e) {
      var btn = e.target.closest('button[data-cat]');
      if (!btn) return;
      state.game.cat = btn.dataset.cat;
      renderGameCatChips();
      renderGameHead();
      renderGameList();
    });

    var t;
    $('#search-game').addEventListener('input', function (e) {
      clearTimeout(t);
      t = setTimeout(function () {
        state.game.q = e.target.value;
        renderGameList();
      }, 120);
    });
  }
/* ============================================================
   THEME
   ============================================================ */
function getStoredTheme() {
  try {
    var v = localStorage.getItem('theme');
    return (v === 'dark' || v === 'light') ? v : null;
  } catch (e) { return null; }
}

function getEffectiveTheme() {
  var stored = getStoredTheme();
  if (stored) return stored;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
    ? 'dark'
    : 'light';
}

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);

  var btn = document.getElementById('theme-toggle');
  if (btn) {
    var goingToLight = theme === 'dark';
    btn.setAttribute('aria-label',
      goingToLight ? 'Aktifkan tema terang' : 'Aktifkan tema gelap');
    btn.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
  }

  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#0f1115' : '#2563eb');
}

function initThemeToggle() {
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;

  // Sinkronkan atribut/aria/meta dengan tema efektif (mungkin sudah di-set oleh inline script)
  applyTheme(getEffectiveTheme());

  btn.addEventListener('click', function () {
    var next = getEffectiveTheme() === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('theme', next); } catch (e) {}
    applyTheme(next);
  });

  // Ikuti perubahan preferensi sistem HANYA jika pengguna belum memilih manual
  if (window.matchMedia) {
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    var handler = function () {
      if (!getStoredTheme()) applyTheme(getEffectiveTheme());
    };
    if (mq.addEventListener) mq.addEventListener('change', handler);
    else if (mq.addListener) mq.addListener(handler); /* Safari < 14 */
  }
}
  /* ============================================================
     INIT
     ============================================================ */
  function init() {
    initThemeToggle();
    var d = $('#last-updated');
    if (d && window.LAST_UPDATED) d.textContent = formatDate(window.LAST_UPDATED);

    // Default pilihan
    state.internet.op = firstKey(window.OPERATORS);
    state.internet.cat = firstKey((window.OPERATORS || {})[state.internet.op]);

    state.game.game = firstKey(window.GAMES);
    var g = (window.GAMES || {})[state.game.game];
    state.game.cat = isArray(g) ? null : firstKey(g);

    renderInternet();
    renderGames();
    bindTabs();
    bindInternetEvents();
    bindGameEvents();
    activateTab('internet', false);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
